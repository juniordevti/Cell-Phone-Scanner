<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Mirror</title>
<style>
  :root { --bg:#0b0d10; --card:#14181d; --text:#e8edf2; --muted:#8a96a3; --accent:#3ddc97; --danger:#ff5c5c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; padding:16px; }
  .card { background:var(--card); border-radius:16px; padding:28px; width:100%; max-width:760px; text-align:center; }
  h1 { margin:0 0 8px; font-size:1.4rem; }
  p { color:var(--muted); margin:6px 0; }
  #qr { display:inline-block; background:#fff; padding:14px; border-radius:12px; margin:18px 0; }
  #qr img, #qr canvas { display:block; }
  .status { display:inline-block; padding:6px 12px; border-radius:999px; font-size:.85rem; background:#222a33; }
  .status.ok { color:var(--accent); } .status.err { color:var(--danger); }
  button { background:var(--accent); color:#04130c; border:0; border-radius:10px; padding:14px 22px;
           font-size:1rem; font-weight:600; cursor:pointer; margin-top:14px; }
  button.secondary { background:#222a33; color:var(--text); }
  video { width:100%; max-height:78vh; background:#000; border-radius:12px; margin-top:14px; }
  .hidden { display:none !important; }
  code { background:#222a33; padding:2px 6px; border-radius:6px; font-size:.8rem; word-break:break-all; }
</style>
</head>
<body>
<div class="card">

  <!-- VIEWER MODE (computer) -->
  <section id="viewer" class="hidden">
    <h1>📱 Phone Mirror</h1>
    <p>Scan the QR code with your phone's camera.</p>
    <div id="qr"></div>
    <div><span id="vStatus" class="status">Starting…</span></div>
    <p id="link" class="hidden"></p>
    <video id="remote" class="hidden" autoplay playsinline muted></video>
    <div id="controls" class="hidden">
      <button id="fsBtn" class="secondary">Fullscreen</button>
    </div>
  </section>

  <!-- SENDER MODE (phone) -->
  <section id="sender" class="hidden">
    <h1>Share this phone's screen</h1>
    <p>Your screen will appear on the computer that showed the QR code. You can stop at any time.</p>
    <div><span id="sStatus" class="status">Ready</span></div>
    <button id="startBtn">Start sharing</button>
    <button id="stopBtn" class="secondary hidden">Stop</button>
    <p id="unsupported" class="hidden" style="color:var(--danger)"></p>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const targetId = params.get("id");

  function setStatus(el, text, cls) {
    el.textContent = text;
    el.className = "status" + (cls ? " " + cls : "");
  }

  /* ---------------- SENDER (phone) ---------------- */
  if (targetId) {
    $("sender").classList.remove("hidden");
    const sStatus = $("sStatus");
    let peer, stream, call;

    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      $("startBtn").classList.add("hidden");
      $("unsupported").classList.remove("hidden");
      $("unsupported").textContent =
        "This browser can't share the screen (iPhone/iOS Safari doesn't support it). " +
        "Use Chrome on Android, or on iPhone use QuickTime (USB cable) on a Mac.";
    }

    $("startBtn").onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 30 }, audio: false
        });
      } catch (e) {
        setStatus(sStatus, "Sharing was cancelled", "err");
        return;
      }

      peer = new Peer();
      peer.on("open", () => {
        call = peer.call(targetId, stream);
        setStatus(sStatus, "Sharing 🔴", "ok");
        $("startBtn").classList.add("hidden");
        $("stopBtn").classList.remove("hidden");
        call.on("close", stop);
        call.on("error", () => setStatus(sStatus, "Connection error", "err"));
      });
      peer.on("error", (e) => setStatus(sStatus, "Error: " + e.type, "err"));
      stream.getVideoTracks()[0].onended = stop; // user stops via system UI
    };

    function stop() {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      if (call) call.close();
      if (peer) peer.destroy();
      setStatus(sStatus, "Sharing stopped");
      $("stopBtn").classList.add("hidden");
      $("startBtn").classList.remove("hidden");
    }
    $("stopBtn").onclick = stop;
    return;
  }

  /* ---------------- VIEWER (computer) ---------------- */
  $("viewer").classList.remove("hidden");
  const vStatus = $("vStatus");
  const peer = new Peer();

  peer.on("open", (id) => {
    const url = location.origin + location.pathname + "?id=" + encodeURIComponent(id);
    new QRCode($("qr"), { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
    $("link").classList.remove("hidden");
    $("link").innerHTML = "Or open on your phone: <code>" + url + "</code>";
    setStatus(vStatus, "Waiting for phone…");
  });

  peer.on("call", (call) => {
    call.answer(); // receive-only
    call.on("stream", (remoteStream) => {
      const v = $("remote");
      v.srcObject = remoteStream;
      v.classList.remove("hidden");
      $("controls").classList.remove("hidden");
      $("qr").classList.add("hidden");
      $("link").classList.add("hidden");
      setStatus(vStatus, "Connected ✔", "ok");
    });
    call.on("close", () => {
      $("remote").classList.add("hidden");
      $("controls").classList.add("hidden");
      $("qr").classList.remove("hidden");
      setStatus(vStatus, "Phone disconnected. Reload to generate a new QR.", "err");
    });
  });

  peer.on("error", (e) => setStatus(vStatus, "Error: " + e.type, "err"));
  $("fsBtn").onclick = () => $("remote").requestFullscreen && $("remote").requestFullscreen();
})();
</script>
</body>
</html>
